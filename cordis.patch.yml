# dsh-aftereffects bundle patch.
# Inserted into the profile's loader tree through `dsh.bundle.patch` in
# package.json. Every value below can be overridden from the profile's own
# cordis.patch.yml without editing this package.
- insert:
    - id: dsh-aftereffects
      name: 'dsh-aftereffects'
      # Cordis resolves required services from the entry's inject declaration,
      # not from `export const inject` in the module. Without this, ctx.tools
      # and ctx.systemPrompt are inaccessible and the plugin fails to load.
      inject: [systemPrompt, tools]
      config:
        enabled: true
        # Leave empty to auto-detect the newest installed After Effects.
        executable: ''
        # Empty means $DSH_HOME/aftereffects.
        workDir: ''
        # How long a freshly spawned headless After Effects may take to report in.
        launchTimeoutMs: 120000
        # Per-job ceiling; rendering waits inside the job.
        jobTimeoutMs: 900000
        # The headless instance exits by itself after this long.
        keepAliveMs: 1800000
